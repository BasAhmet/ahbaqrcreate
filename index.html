<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş QR Kod Oluşturucu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Styling Kütüphanesi -->
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Sol Taraf: Ayarlar ve Formlar -->
        <div class="space-y-6">
            <h2 class="text-2xl font-bold text-gray-800 border-b pb-2">QR Kod Ayarları</h2>
            
            <!-- 1. Veri Türü Seçimi -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Veri Türü</label>
                <select id="dataType" onchange="changeForm()" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="text">URL / Metin</option>
                    <option value="wifi">Wi-Fi Bağlantısı</option>
                    <option value="vcard">vCard (Kartvizit)</option>
                    <option value="email">E-Posta</option>
                </select>
            </div>

            <!-- Dinamik Form Alanı -->
            <div id="formContainer" class="space-y-3 bg-gray-50 p-4 rounded-md border border-gray-200">
                <!-- JavaScript ile doldurulacak -->
            </div>

            <!-- 2. Tasarım Özelleştirme -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-gray-800">Tasarım & Logo</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Kare Rengi</label>
                        <input type="color" id="qrColor" value="#000000" class="w-full h-10 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">Arka Plan</label>
                        <input type="color" id="bgColor" value="#ffffff" class="w-full h-10 rounded cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-gray-600 mb-1">Logo Yükle (İsteğe Bağlı)</label>
                    <input type="file" id="logoInput" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
            </div>

            <button onclick="generateQR()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors">
                QR Kod Üret
            </button>
        </div>

        <!-- Sağ Taraf: Önizleme ve İndirme -->
        <div class="flex flex-col items-center justify-center bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 p-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Önizleme</h3>
            
            <!-- QR Kod Buraya Çizilecek -->
            <div id="canvas" class="mb-6 bg-white p-2 shadow-sm rounded-lg"></div>

            <!-- 3. İndirme Butonları -->
            <div class="flex gap-2 w-full max-w-xs">
                <button onclick="downloadQR('png')" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-md font-medium transition-colors">PNG İndir</button>
                <button onclick="downloadQR('svg')" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white py-2 rounded-md font-medium transition-colors">SVG İndir</button>
            </div>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
